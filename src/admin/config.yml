# Use DecapBridge classic auth (required)
backend:
  name: git-gateway
  repo: sindikoi/LEE_PET_SALON
  branch: main
  identity_url: https://auth.decapbridge.com/sites/f252acfd-c928-4268-a6ab-2e81fdf18752
  gateway_url: https://gateway.decapbridge.com
  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge
# Better Decap + Bridge logo (optional)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg
# Add site links in Decap CMS (optional)
site_url: https://lee-pets-salon.netlify.app

media_folder: "src/images"
public_folder: "/images"

collections:
  - name: "homepage"
    label: "🏠 דף הבית — טקסטים ופרטי קשר"
    delete: false
    editor:
      preview: false
    files:
      - name: "homepage"
        label: "עריכת דף הבית"
        file: "src/content/homepage.json"
        fields:
          - { label: "כותרת ראשית", name: "hero_title", widget: "string" }
          - { label: "משפט מתחת לכותרת", name: "hero_subtitle", widget: "text" }
          - { label: "טלפון להצגה", name: "phone_display", widget: "string", hint: "לדוגמה: 052-294-1899 — מעדכן גם וואטסאפ וחיוג אוטומטית" }
          - { label: "כתובת הסלון", name: "address", widget: "string" }
          - { label: "קישור לאינסטגרם", name: "instagram_url", widget: "string" }

  - name: "products"
    label: "🛍️ מוצרים בחנות"
    delete: false
    editor:
      preview: false
    files:
      - name: "products"
        label: "רשימת המוצרים"
        file: "src/content/products.json"
        fields:
          - label: "מוצרים"
            name: "items"
            widget: "list"
            label_singular: "מוצר"
            summary: "{{fields.title}}"
            fields:
              - { label: "שם המוצר", name: "title", widget: "string" }
              - { label: "תיאור קצר", name: "description", widget: "text" }
              - { label: "מחיר", name: "price", widget: "string", hint: "לדוגמה: ₪65" }
              - { label: "תמונת מוצר", name: "image", widget: "image", required: false }

  - name: "gallery"
    label: "✨ גלריה — לפני ואחרי"
    delete: false
    editor:
      preview: false
    files:
      - name: "gallery"
        label: "תמונות לפני / אחרי"
        file: "src/content/gallery.json"
        fields:
          - label: "כרטיסיות"
            name: "items"
            widget: "list"
            label_singular: "כרטיסייה"
            summary: "{{fields.title}}"
            fields:
              - { label: "כותרת / שם החיה", name: "title", widget: "string" }
              - { label: "תמונת לפני", name: "before_image", widget: "image", required: false }
              - { label: "תמונת אחרי", name: "after_image", widget: "image", required: false }
