backend:
  name: netlify

media_folder: "images"
public_folder: "images"

collections:
  - name: "gallery"
    label: "לפני ואחרי (גלריה)"
    folder: "content/gallery"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "כותרת / שם החיה", name: "title", widget: "string" }
      - { label: "תמונת לפני", name: "before_image", widget: "image" }
      - { label: "תמונת אחרי", name: "after_image", widget: "image" }

  - name: "products"
    label: "מוצרים בחנות"
    folder: "content/products"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "שם המוצר", name: "title", widget: "string" }
      - { label: "תיאור קצר", name: "description", widget: "text" }
      - { label: "מחיר", name: "price", widget: "string" }
      - { label: "תמונת מוצר", name: "image", widget: "image" }

  - name: "site_content"
    label: "טקסטים ותוכן האתר"
    files:
      - name: "homepage_content"
        label: "עריכת טקסטים בדף הבית"
        file: "content/homepage.json"
        fields:
          - { label: "כותרת ראשית", name: "hero_title", widget: "string" }
          - { label: "תת-כותרת / תיאור קצר", name: "hero_subtitle", widget: "text" }
          - { label: "אודות הסלון", name: "about_text", widget: "text" }
          - { label: "מספר טלפון ליצירת קשר", name: "phone_number", widget: "string" }
          - { label: "כתובת הסלון", name: "address", widget: "string" }